[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
# UI framework. gpui-component is built on the `gpui-pre` snapshot of Zed's
# GPUI, so the app must use the very same crate and version.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Grammars for the languages of phases 6 (web and Rust) and 11 (the others).
# JSON is always built in; XML, Dockerfile and `.properties` come from
# their own crates in `language`.
# The editor engine under gpui-component, for what it does not re-export.
gpui-base = "=0.9.1"
gpui-component = { version = "=0.9.1", features = [
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-rust",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-sql",
    "tree-sitter-make",
] }
# The macOS platform for GPUI; `font-kit` is needed to draw any text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# Icons used by gpui-component (search panel, folding chevrons...).
gpui-kit-assets = "=0.9.1"

# Extensions: V8 through deno_core, VSIX packages, messages
anyhow = "1.0.104"
deno_core = "=0.413.0"
# Error type of deno_core ops, pinned to the version deno_core uses.
deno_error = "=0.7.1"
futures = "0.3.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# The Mac's preferred language, for the interface.
sys-locale = "0.3.2"

# Project files: .gitignore rules, glob patterns, the macOS Trash.
ignore = "0.4.34"
globset = "0.4.21"
trash = "5.3.0"
# Watching the project for changes made outside Keel (FSEvents on macOS).
notify = "8.2.2"
# Search in files.
regex = "1.13.1"

# Terminals: the emulator of Alacritty, and libc for the shell's process.
alacritty_terminal = { version = "=0.26.0", default-features = false }
libc = "0.2.191"
# The poller Alacritty's event loop waits on, for Keel's copy of that loop.
polling = "3.11.0"

# The bits of macOS GPUI does not reach (the Window and Help menus, the
# Dock's badge, accessibility, files on the pasteboard, dragging files out):
# the same bindings GPUI itself uses.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSView", "NSWindow", "NSEvent", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSImage", "NSGraphics"] }

# Git: line differences for the editor's margin and for staging blocks.
imara-diff = "=0.2.0"

# Image sizes, read from the file header: the version GPUI uses.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }

# The Markdown parser gpui-component uses, to map the preview to its source.
markdown = "=1.0.0"

# Language server protocol types, the version gpui-component uses.
lsp-types = "0.97"

# Keel crates
ai = { path = "crates/ai" }
extensions = { path = "crates/extensions" }
settings = { path = "crates/settings" }
workbench = { path = "crates/workbench" }
editor = { path = "crates/editor" }
files = { path = "crates/files" }
language = { path = "crates/language" }
terminal = { path = "crates/terminal" }
git = { path = "crates/git" }
lsp = { path = "crates/lsp" }
dap = { path = "crates/dap" }
pdf = { path = "crates/pdf" }
update = { path = "crates/update" }

# Grammars gpui-component does not ship.
tree-sitter-xml = "0.7.0"
tree-sitter-containerfile = "0.9.2"
tree-sitter-properties = "0.3.0"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"

# Testing
tempfile = "3.27"
tree-sitter = "0.26"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
split-debuginfo = "unpacked"

# GPUI is noticeably slow when compiled without optimizations, so dependencies
# are optimized even in debug builds. They are built once and then cached.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

# A copy of gpui-base 0.9.1 with a few functions made public that Keel
# needs and the published crate keeps private (keyboard folds, all the
# selections, regex search). Each change is marked `KEEL:` and listed in
# vendor/gpui-base/KEEL.md; on a new version, copy it again and redo them.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
