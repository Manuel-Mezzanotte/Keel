[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
# UI framework. gpui-component is built on the `gpui-pre` snapshot of Zed's
# GPUI, so the app must use the very same crate and version.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Grammars for the languages of phase 6: web and Rust. JSON is always built in.
gpui-component = { version = "=0.9.1", features = [
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-rust",
    "tree-sitter-bash",
] }
# The macOS platform for GPUI; `font-kit` is needed to draw any text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# Icons used by gpui-component (search panel, folding chevrons...).
gpui-kit-assets = "=0.9.1"

# Extensions: V8 through deno_core, VSIX packages, messages
anyhow = "1.0.104"
deno_core = "=0.413.0"
# Error type of deno_core ops, pinned to the version deno_core uses.
deno_error = "=0.7.1"
futures = "0.3.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# The Mac's preferred language, for the interface.
sys-locale = "0.3.2"

# Project files: .gitignore rules, glob patterns, the macOS Trash.
ignore = "0.4.34"
globset = "0.4.21"
trash = "5.3.0"
# Watching the project for changes made outside Keel (FSEvents on macOS).
notify = "8.2.2"
# Search in files.
regex = "1.13.1"

# Terminals: the emulator of Alacritty, and libc for the shell's process.
alacritty_terminal = { version = "=0.26.0", default-features = false }
libc = "0.2.191"

# Git: line differences for the editor's margin and for staging blocks.
imara-diff = "=0.2.0"

# Image sizes, read from the file header: the version GPUI uses.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }

# The Markdown parser gpui-component uses, to map the preview to its source.
markdown = "=1.0.0"

# Language server protocol types, the version gpui-component uses.
lsp-types = "0.97"

# Keel crates
extensions = { path = "crates/extensions" }
settings = { path = "crates/settings" }
workbench = { path = "crates/workbench" }
editor = { path = "crates/editor" }
files = { path = "crates/files" }
language = { path = "crates/language" }
terminal = { path = "crates/terminal" }
git = { path = "crates/git" }
lsp = { path = "crates/lsp" }
pdf = { path = "crates/pdf" }

# Testing
tempfile = "3.27"
tree-sitter = "0.26"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
split-debuginfo = "unpacked"

# GPUI is noticeably slow when compiled without optimizations, so dependencies
# are optimized even in debug builds. They are built once and then cached.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
