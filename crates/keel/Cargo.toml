[package]
name = "keel"
description = "A fast, lightweight code editor for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[features]
# Draws the window off screen into PNG files, to look at the interface
# without showing anything: `scripts/snapshots.sh`. Never in a release.
snapshots = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
ai.workspace = true
anyhow.workspace = true
editor.workspace = true
extensions.workspace = true
files.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
gpui_platform.workspace = true
git.workspace = true
lsp.workspace = true
pdf.workspace = true
markdown.workspace = true
image.workspace = true
globset.workspace = true
regex.workspace = true
libc.workspace = true
language.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
sys-locale.workspace = true
terminal.workspace = true
workbench.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tungstenite = "0.30.0"
zip.workspace = true

[lints]
workspace = true
