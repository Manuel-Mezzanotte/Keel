[package]
name = "keel"
description = "A fast, lightweight code editor for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[features]
# Draws the window off screen into PNG files, to look at the interface
# without showing anything: `scripts/snapshots.sh`. Never in a release.
snapshots = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
ai.workspace = true
anyhow.workspace = true
editor.workspace = true
extensions.workspace = true
files.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
gpui_platform.workspace = true
git.workspace = true
update.workspace = true
lsp.workspace = true
dap.workspace = true
pdf.workspace = true
web.workspace = true
raw-window-handle = "0.6"
markdown.workspace = true
image.workspace = true
globset.workspace = true
regex.workspace = true
libc.workspace = true
language.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
sys-locale.workspace = true
terminal.workspace = true
workbench.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
security-framework = "3.7.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
sha2.workspace = true
tempfile.workspace = true
tungstenite = "0.30.0"
update = { workspace = true, features = ["test-support"] }
zip.workspace = true

[lints]
workspace = true
