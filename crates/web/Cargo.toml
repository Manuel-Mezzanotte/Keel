[package]
name = "web"
description = "Pages of the web inside Keel's window: macOS's WebKit laid over it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSURLRequest", "NSGeometry", "NSError", "NSValue", "NSDictionary", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKNavigation"] }

[lints]
workspace = true
